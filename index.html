<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TeeViewer — explore Teeworlds / DDNet players, clans, maps and servers. Live network statistics, player profiles and map rankings.">
    <title>TeeViewer — Your Teeworlds Journey, Visualized</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <img onclick="navigateToPage('index.html')" class="logo" src="logo.png" alt="TeeViewer logo">
        <nav class="nav-buttons" aria-label="Main navigation">
            <button onclick="navigateToPage('players.html')" class="categories">Players</button>
            <button onclick="navigateToPage('clans.html')" class="categories">Clans</button>
            <button onclick="navigateToPage('maps.html')" class="categories">Maps</button>
            <button onclick="navigateToPage('servers.html')" class="categories">Servers</button>
            <button onclick="navigateToPage('status.html')" class="categories">Status</button>
            <button onclick="window.location.href='https://discord.com/oauth2/authorize?client_id=1391161122714943528&permissions=117760&scope=bot+applications.commands'" class="categories">Discord Bot</button>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-left">
            <img class="hero-logo" src="logo.png" alt="TeeViewer">
            <h1 class="slogan">Your Teeworlds journey, <span class="accent">visualized.</span></h1>
            <p class="hero-sub">Player profiles, clan rosters, map rankings and every live server on the DDNet network — in one calm, fast dashboard.</p>
            <div class="hero-cta">
                <button class="button primary" onclick="navigateToPage('players.html')">Find a player</button>
                <button class="button" onclick="navigateToPage('servers.html')">Browse servers</button>
            </div>
        </div>

        <div class="stats-container" id="homeStats" aria-live="polite">
            <div class="stats" id="statPlayers" onclick="navigateToPage('players.html')" role="link" tabindex="0">
                <div class="loading"></div>
                <div class="label">Players online</div>
            </div>
            <div class="stats" id="statServers" onclick="navigateToPage('servers.html')" role="link" tabindex="0">
                <div class="loading"></div>
                <div class="label">Live servers</div>
            </div>
            <div class="stats" id="statClans" onclick="navigateToPage('clans.html')" role="link" tabindex="0">
                <div class="loading"></div>
                <div class="label">Clans</div>
            </div>
            <div class="stats" id="statMaps" onclick="navigateToPage('maps.html')" role="link" tabindex="0">
                <div class="loading"></div>
                <div class="label">Maps</div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <span>TeeViewer · live data from status.tw &amp; ddstats.tw</span>
        <span id="footMeta">Fetching network status…</span>
    </footer>

    <script>
        function navigateToPage(url) { window.location.href = url; }

        const fmt = (n) => (typeof n === 'number') ? n.toLocaleString('en-US') : '—';

        function setStat(id, value) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = '';
            const v = document.createElement('div');
            v.className = 'value';
            v.textContent = fmt(value);
            const l = document.createElement('div');
            l.className = 'label';
            l.textContent = el.querySelector('.label') ? el.querySelector('.label').textContent : '';
            el.append(v, l);
        }

        // preserve labels before overwriting
        const LABELS = {
            statPlayers: 'Players online',
            statServers: 'Live servers',
            statClans: 'Clans',
            statMaps: 'Maps',
        };

        async function loadStats() {
            try {
                const res = await fetch('https://api.status.tw/stats');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const d = await res.json();
                [['statPlayers', d.numPlayers], ['statServers', d.numServers],
                 ['statClans', d.numClans], ['statMaps', d.numMaps]].forEach(([id, val]) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.innerHTML = '<div class="value"></div><div class="label">' + LABELS[id] + '</div>';
                    el.querySelector('.value').textContent = fmt(val);
                });
                const meta = document.getElementById('footMeta');
                if (meta && (d.numGameTypes != null || d.numVersions != null)) {
                    meta.textContent = (d.numGameTypes != null ? d.numGameTypes + ' game types · ' : '') +
                                       (d.numVersions != null ? d.numVersions + ' client versions' : '');
                }
            } catch (e) {
                Object.keys(LABELS).forEach((id) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.innerHTML = '<div class="value">—</div><div class="label">' + LABELS[id] + '</div>';
                });
                const meta = document.getElementById('footMeta');
                if (meta) meta.textContent = 'Live status unavailable';
            }
        }
        window.addEventListener('load', loadStats);
    </script>
</body>
</html>
